site_name: Data Leak Inspector

strict: false

theme:
  name: material

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - navigation.tracking

    - search.highlight
    - search.suggest
    - search.share

    - content.code.copy
    - content.code.annotate

    - toc.follow
    - toc.integrate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite

  - pymdownx.tabbed:
      alternate_style: true

  - toc:
      permalink: true

plugins:
  - search

  - awesome-pages

  - i18n:
      docs_structure: folder

      reconfigure_material: true

      fallback_to_default: true

      languages:

        - locale: es
          default: true
          name: Español
          build: true

          nav:
            - Inicio: index.md 
            - Comandos: 
              - comandos/auth.md
              - comandos/init.md
              - comandos/logout.md
              - comandos/scan.md
            - Tutoriales: tutoriales/overview.md 
            - FAQ: faq.md
            - Privacidad: privacidad.md
            - Changelog: changelog.md

        - locale: en
          name: English
          build: true

          nav:
            - Home: index.md
            - Commands: 
              - comandos/auth.md
              - comandos/init.md
              - comandos/logout.md
              - comandos/scan.md
            - Tutorials: tutorials/overview.md  
            - FAQ: faq.md
            - Privacy: privacy.md
            - Changelog: changelog.md