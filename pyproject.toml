[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "data-leak-inspector"
version = "0.1.0"
description = "Tool for detecting sensitive data leaks in files and cloud storage"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Johan Smith Rueda (Smithech)" },
]
dependencies = [
    "google-api-python-client>=2.195.0",
    "google-auth-httplib2>=0.3.1",
    "google-auth-oauthlib>=1.3.1",
    "platformdirs>=4.9.6",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "rich>=15.0.0",
    "toml>=0.10.2",
    "typer>=0.24.1",
]

[project.license]
text = "MIT"

[project.scripts]
dli = "leak_inspector.interfaces.cli.main:main"

[dependency-groups]
dev = [
    "build>=1.5.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
    "tomli-w>=1.2.0",
    "tomli>=2.4.1",
    "twine>=6.2.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.ruff]
line-length = 88
target-version = "0.1.0.dev1"
fix = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
fixable = [
    "ALL",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
