name: Deploy Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          run: pip install .[dev]

      - name: Deploy documentation
        run: mkdocs gh-deploy --force